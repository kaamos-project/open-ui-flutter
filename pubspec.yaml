name: kaamos_ui
description: Kaamos design system for Flutter. Custom widgets on top of the widgets layer only (no Material, no Cupertino), identical on every platform.
version: 0.1.0-dev
repository: https://github.com/kaamos-project/open-ui-flutter
# Come i token: niente pub.dev per ora, si usa come dipendenza git (ref = tag).
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  kaamos_design_tokens:
    git:
      url: https://github.com/kaamos-project/open-design-tokens
      ref: v0.1.0
      path: dist/flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
